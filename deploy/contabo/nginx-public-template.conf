# INACTIVE TEMPLATE. Replace placeholders only after domain, TLS and public
# clinical access are approved. Do not symlink this file into sites-enabled now.
server {
    listen 80;
    server_name __APP_DOMAIN__;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name __APP_DOMAIN__;
    ssl_certificate __CERTIFICATE_FULLCHAIN_PATH__;
    ssl_certificate_key __CERTIFICATE_PRIVATE_KEY_PATH__;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
