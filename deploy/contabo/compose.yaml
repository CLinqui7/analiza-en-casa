name: analiza-contabo-staging
services:
  database:
    image: ${POSTGRES_IMAGE:?Set a verified PostgreSQL 18 image digest}
    network_mode: none
    environment:
      POSTGRES_DB: analiza_en_casa
      POSTGRES_USER: analiza_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets: [postgres_password]
    command: [postgres, -c, listen_addresses=, -c, unix_socket_permissions=0777, -c, shared_buffers=256MB, -c, max_connections=40]
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h /var/run/postgresql -U analiza_migrator -d analiza_en_casa']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
  migrate:
    image: ${OPERATOR_IMAGE:?Set the matching operator image}
    profiles: [operator]
    network_mode: none
    env_file: [./secrets/operator.env]
    command: [--migrate, --provision-runtime]
    volumes: [pgsocket:/var/run/postgresql]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
  web:
    image: ${WEB_IMAGE:?Set the verified web image}
    env_file: [./secrets/web.env]
    environment:
      ANALIZA_DATA_MODE: postgresql
      NEXT_PUBLIC_DATA_MODE: postgresql
      NEXT_PUBLIC_RELEASE_PROFILE: full
      ANALIZA_DB_TRANSPORT: unix
      PGHOST: /var/run/postgresql
      PGDATABASE: analiza_en_casa
      PGUSER: analiza_app
      PGPOOL_MAX: '5'
      ANALIZA_FILE_STORAGE: filesystem
      ANALIZA_FILES_PATH: /data/private-files
      ANALIZA_ALLOW_DEMO_SEED: '0'
      NEXT_PUBLIC_DEMO_SEED_ENABLED: '0'
      ANALIZA_REGISTRATION_MODE: disabled
      HOSTNAME: 0.0.0.0
      PORT: '8080'
    ports: ['127.0.0.1:18081:8080']
    volumes:
      - pgsocket:/var/run/postgresql:ro
      - ./files:/data/private-files
    depends_on:
      database: { condition: service_healthy }
    init: true
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 3
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
    stop_grace_period: 15s
volumes:
  pgdata:
  pgsocket:
secrets:
  postgres_password:
    file: ./secrets/postgres-password
