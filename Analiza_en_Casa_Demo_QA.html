<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2d3f">
<meta name="color-scheme" content="light">
<title>Analiza en Casa · Demo QA autónoma</title>
<style>:root {
  --navy-950: #0b2230;
  --navy-900: #0f2d3f;
  --navy-800: #173e54;
  --navy-700: #24556c;
  --teal-700: #0c746d;
  --teal-600: #15938b;
  --teal-500: #20b6aa;
  --teal-100: #dff6f3;
  --teal-50: #edf9f8;
  --green-600: #248e50;
  --green-100: #e9f8ef;
  --blue-600: #397caa;
  --blue-100: #eaf5fb;
  --amber-700: #9c6b0d;
  --amber-500: #f2b94b;
  --amber-100: #fff5dd;
  --coral-700: #b94b47;
  --coral-500: #ef746e;
  --coral-100: #ffeded;
  --purple-600: #6657b8;
  --purple-100: #f0edff;
  --ink: #173042;
  --muted: #6c7d88;
  --muted-2: #8ba0aa;
  --line: #dce7ec;
  --line-strong: #c4d6de;
  --surface: #ffffff;
  --surface-soft: #f9fbfc;
  --canvas: #f3f7f9;
  --shadow-sm: 0 4px 14px rgba(15, 45, 63, .06);
  --shadow: 0 14px 40px rgba(15, 45, 63, .09);
  --shadow-lg: 0 30px 80px rgba(15, 45, 63, .18);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --sidebar-w: 282px;
  --topbar-h: 70px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--canvas);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; }

button { color: inherit; }

a { color: inherit; text-decoration: none; }

img { max-width: 100%; }

.hidden { display: none !important; }

.muted { color: var(--muted); }

.small { font-size: 12px; }

.tiny { font-size: 10px; }

.text-right { text-align: right; }

.text-center { text-align: center; }

.w-full { width: 100%; }

.flex { display: flex; }

.items-center { align-items: center; }

.justify-between { justify-content: space-between; }

.gap-6 { gap: 6px; }

.gap-8 { gap: 8px; }

.gap-10 { gap: 10px; }

.gap-12 { gap: 12px; }

.gap-16 { gap: 16px; }

.stack { display: flex; flex-direction: column; gap: 12px; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }

.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background:
    radial-gradient(circle at 10% 0%, rgba(32, 182, 170, .18), transparent 28%),
    linear-gradient(180deg, var(--navy-950), var(--navy-900));
  color: white;
  display: flex;
  flex-direction: column;
  z-index: 40;
  overflow: hidden;
  box-shadow: 12px 0 34px rgba(15, 45, 63, .12);
}

.sidebar-header {
  height: 82px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 22px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(145deg, var(--teal-500), #4cd2c7);
  color: var(--navy-950);
  font-weight: 900;
  letter-spacing: -.03em;
  box-shadow: 0 10px 24px rgba(32, 182, 170, .22);
}

.brand-copy strong { display: block; font-size: 15px; }
.brand-copy small { color: rgba(255,255,255,.62); display: block; margin-top: 1px; }

.sidebar-demo-tag {
  margin: 14px 18px 6px;
  padding: 10px 12px;
  border: 1px solid rgba(242, 185, 75, .35);
  background: rgba(242, 185, 75, .1);
  color: #ffe3a2;
  border-radius: 12px;
  font-size: 11px;
  line-height: 1.45;
}

.nav-scroll {
  padding: 10px 12px 24px;
  overflow-y: auto;
  flex: 1;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.2) transparent;
}

.nav-group { margin-top: 16px; }

.nav-group-title {
  padding: 0 12px 7px;
  color: rgba(255,255,255,.42);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  font-weight: 800;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  margin: 2px 0;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: rgba(255,255,255,.75);
  cursor: pointer;
  text-align: left;
  transition: .16s ease;
}

.nav-item:hover {
  color: white;
  background: rgba(255,255,255,.07);
  transform: translateX(2px);
}

.nav-item.active {
  color: white;
  background: linear-gradient(90deg, rgba(32,182,170,.24), rgba(32,182,170,.08));
  box-shadow: inset 3px 0 0 var(--teal-500);
}

.nav-icon {
  width: 19px;
  height: 19px;
  flex: 0 0 19px;
  display: grid;
  place-items: center;
  opacity: .95;
}

.nav-label { flex: 1; min-width: 0; }

.nav-count {
  min-width: 22px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: 10px;
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.75);
}

.sidebar-footer {
  padding: 14px 18px 18px;
  border-top: 1px solid rgba(255,255,255,.08);
}

.user-card {
  display: flex;
  gap: 11px;
  align-items: center;
  padding: 11px;
  border-radius: 13px;
  background: rgba(255,255,255,.06);
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  background: linear-gradient(145deg, #dff6f3, #8ee3dc);
  color: var(--teal-700);
  flex: 0 0 auto;
}

.user-card strong { display:block; font-size: 12px; }
.user-card small { display:block; color: rgba(255,255,255,.55); margin-top:2px; }

.main {
  grid-column: 2;
  min-width: 0;
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 28px;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(220,231,236,.88);
}

.mobile-menu {
  display: none;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: white;
  cursor: pointer;
}

.search-box {
  flex: 1;
  max-width: 660px;
  position: relative;
}

.search-box input {
  width: 100%;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface-soft);
  padding: 0 42px 0 40px;
  outline: none;
  color: var(--ink);
  transition: .16s;
}

.search-box input:focus {
  border-color: var(--teal-500);
  background: white;
  box-shadow: 0 0 0 3px rgba(32,182,170,.1);
}

.search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}

.search-hint {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: 1px solid var(--line);
  background: white;
  border-radius: 6px;
  font-size: 10px;
  padding: 3px 6px;
  color: var(--muted);
}

.topbar-actions { margin-left: auto; display:flex; align-items:center; gap:9px; }

.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: white;
  cursor: pointer;
  position: relative;
  transition: .16s;
}

.icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }

.notification-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--coral-500);
  border: 2px solid white;
}

.environment-pill {
  height: 38px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 11px;
  border-radius: 11px;
  background: var(--teal-50);
  border: 1px solid #caebe8;
  color: var(--teal-700);
  font-size: 11px;
  font-weight: 700;
}

.environment-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--teal-500);
  box-shadow: 0 0 0 4px rgba(32,182,170,.12);
}

.page {
  padding: 28px 30px 60px;
  max-width: 1760px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 22px;
}

.page-kicker {
  color: var(--teal-600);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .09em;
  font-weight: 850;
  margin-bottom: 6px;
}

.page-title {
  margin: 0;
  font-size: clamp(24px, 2.1vw, 34px);
  line-height: 1.1;
  letter-spacing: -.035em;
  color: var(--navy-900);
}

.page-description {
  max-width: 780px;
  margin: 8px 0 0;
  color: var(--muted);
  line-height: 1.55;
}

.page-actions {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.btn {
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 720;
  font-size: 12px;
  transition: .16s ease;
  white-space: nowrap;
}

.btn:hover { transform: translateY(-1px); }

.btn:active { transform: translateY(0); }

.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.btn-primary {
  background: linear-gradient(135deg, var(--teal-600), var(--teal-500));
  color: white;
  box-shadow: 0 7px 18px rgba(21,147,139,.2);
}

.btn-primary:hover { box-shadow: 0 9px 24px rgba(21,147,139,.28); }

.btn-secondary {
  background: white;
  border-color: var(--line);
  color: var(--navy-800);
}

.btn-secondary:hover { border-color: #b9d5d2; box-shadow: var(--shadow-sm); }

.btn-danger { background: var(--coral-100); color: var(--coral-700); border-color: #f7cecb; }

.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }

.btn-sm { height: 32px; padding: 0 10px; border-radius: 8px; font-size: 11px; }

.btn-lg { height: 46px; padding: 0 18px; font-size: 13px; }

.card {
  background: var(--surface);
  border: 1px solid rgba(220,231,236,.9);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.card-pad { padding: 18px; }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 19px 14px;
  border-bottom: 1px solid var(--line);
}

.card-head h3 { margin:0 0 4px; color:var(--navy-900); font-size:15px; }
.card-head p { margin:0; color:var(--muted); font-size:12px; }

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 16px;
  margin-bottom: 18px;
}

.metric-card {
  padding: 18px;
  border-radius: var(--radius);
  border: 1px solid rgba(220,231,236,.9);
  background: white;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.metric-card::after {
  content:"";
  position:absolute;
  width:100px;height:100px;border-radius:50%;
  right:-48px;top:-52px;
  background: var(--metric-soft, var(--teal-100));
  opacity:.7;
}

.metric-top { display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative;z-index:1; }

.metric-icon {
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--metric-soft,var(--teal-100)); color:var(--metric-color,var(--teal-700));
  font-size:18px;font-weight:850;
}

.metric-trend { font-size:10px;color:var(--muted); }

.metric-value {
  position:relative;z-index:1;
  margin-top:14px;
  font-size:26px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.04em;
  color:var(--navy-900);
}

.metric-label { position:relative;z-index:1; margin-top:6px;color:var(--muted);font-size:12px; }

.toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding: 14px 16px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}

.toolbar-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.filter-field, .field, .select, .textarea {
  border:1px solid var(--line);
  background:white;
  color:var(--ink);
  border-radius:10px;
  outline:none;
  transition:.16s;
}

.filter-field { height:36px; padding:0 10px; font-size:11px; }

.field, .select { width:100%; height:42px; padding:0 11px; }

.textarea { width:100%; min-height:100px; padding:10px 11px; resize:vertical; }

.field:focus, .select:focus, .textarea:focus, .filter-field:focus {
  border-color: var(--teal-500);
  box-shadow:0 0 0 3px rgba(32,182,170,.1);
}

.field[readonly] { background:#f5f8fa;color:var(--muted); }

.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; }

.form-grid.cols-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }

.form-grid.cols-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }

.form-group { min-width:0; }

.form-group.span-2 { grid-column: span 2; }

.form-group.span-3 { grid-column: span 3; }

.form-group.span-all { grid-column:1/-1; }

.form-group label {
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:6px;font-size:11px;font-weight:760;color:var(--navy-800);
}

.form-group label small { font-weight:500;color:var(--muted); }

.form-help { margin-top:5px;font-size:10px;color:var(--muted); }

.checkbox-row { display:flex;gap:16px;align-items:center;flex-wrap:wrap; }

.check {
  display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);cursor:pointer;
}

.check input { width:16px;height:16px;accent-color:var(--teal-600); }

.table-wrap { width:100%; overflow:auto; }

table {
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

th, td {
  text-align:left;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}

th {
  position:sticky;
  top:0;
  z-index:2;
  background:#f6fafb;
  color:#607985;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.055em;
  font-weight:850;
}

td { font-size:12px; }

tbody tr { transition:.14s; }

tbody tr:hover { background:#fbfdfd; }

.table-primary { font-weight:760;color:var(--navy-900); }

.table-secondary { display:block;color:var(--muted);font-size:10px;margin-top:2px; }

.table-actions { display:flex;justify-content:flex-end;gap:5px; }

.row-clickable { cursor:pointer; }

.badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:24px;
  padding:3px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:760;
  white-space:nowrap;
  border:1px solid transparent;
}

.badge::before {
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:currentColor;
  opacity:.75;
}

.badge-neutral { background:#eef3f5;color:#607985;border-color:#dce7ec; }
.badge-info { background:var(--blue-100);color:var(--blue-600);border-color:#d1e6f2; }
.badge-warning { background:var(--amber-100);color:var(--amber-700);border-color:#f7e3af; }
.badge-success { background:var(--green-100);color:var(--green-600);border-color:#cdebd8; }
.badge-danger { background:var(--coral-100);color:var(--coral-700);border-color:#f5cbc8; }
.badge-purple { background:var(--purple-100);color:var(--purple-600);border-color:#ddd7ff; }

.notice {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid;
  line-height:1.5;
  font-size:11px;
}

.notice strong { display:block; margin-bottom:2px; }
.notice-info { background:var(--blue-100);border-color:#cee5f1;color:#265f83; }
.notice-warning { background:var(--amber-100);border-color:#f3dc9e;color:#7b550f; }
.notice-success { background:var(--green-100);border-color:#c8e8d3;color:#1d7040; }
.notice-danger { background:var(--coral-100);border-color:#f6cac7;color:#9b3f3b; }

.tabs {
  display:flex;
  gap:4px;
  border-bottom:1px solid var(--line);
  padding:0 16px;
  overflow:auto;
  background:white;
}

.tab {
  border:0;
  background:transparent;
  padding:13px 11px 11px;
  color:var(--muted);
  cursor:pointer;
  font-size:11px;
  font-weight:740;
  border-bottom:2px solid transparent;
  white-space:nowrap;
}

.tab.active { color:var(--teal-700); border-bottom-color:var(--teal-500); }

.detail-hero {
  padding:20px;
  border-radius:var(--radius);
  background:
    radial-gradient(circle at 90% 20%, rgba(32,182,170,.18), transparent 30%),
    linear-gradient(135deg, var(--navy-950), var(--navy-800));
  color:white;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.detail-hero-top { display:flex;align-items:flex-start;justify-content:space-between;gap:16px; }

.detail-hero h2 { margin:0;font-size:24px;letter-spacing:-.035em; }
.detail-hero p { margin:6px 0 0;color:rgba(255,255,255,.68); }

.detail-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-top:18px;
}

.detail-field {
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
}

.detail-field small { display:block;color:rgba(255,255,255,.58);font-size:10px;margin-bottom:3px; }
.detail-field strong { font-size:11px; }

.timeline { position:relative; padding-left:24px; }

.timeline::before {
  content:""; position:absolute; left:7px; top:5px; bottom:5px; width:2px; background:var(--line);
}

.timeline-item { position:relative; padding:0 0 18px; }
.timeline-item:last-child { padding-bottom:0; }

.timeline-dot {
  position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;
  background:white;border:3px solid var(--teal-500);box-shadow:0 0 0 3px white;
}

.timeline-item.pending .timeline-dot { border-color:var(--line-strong); }
.timeline-item.danger .timeline-dot { border-color:var(--coral-500); }

.timeline-item strong { display:block;font-size:11px;color:var(--navy-900); }
.timeline-item p { margin:3px 0 0;color:var(--muted);font-size:11px; }
.timeline-item time { display:block;margin-top:4px;color:var(--muted-2);font-size:9px; }

.kanban {
  display:grid;
  grid-template-columns:repeat(4,minmax(260px,1fr));
  gap:14px;
  overflow:auto;
  padding-bottom:8px;
}

.kanban-col {
  background:#eef4f6;
  border-radius:14px;
  padding:11px;
  min-height:280px;
}

.kanban-head { display:flex;align-items:center;justify-content:space-between;padding:3px 3px 10px;font-size:11px; }
.kanban-count { min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:white;display:grid;place-items:center;font-size:10px; }

.kanban-card {
  background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;
  box-shadow:0 3px 10px rgba(15,45,63,.04);cursor:pointer;
}

.kanban-card:hover { border-color:#b9d8d5;transform:translateY(-1px); }
.kanban-card strong { display:block;color:var(--navy-900);font-size:11px; }
.kanban-card small { display:block;color:var(--muted);margin-top:3px; }
.kanban-card .card-footer { margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px; }

.progress {

}

.progress > span { display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal-600),var(--teal-500)); }

.quote-layout { display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px; }

.quote-items { border:1px solid var(--line);border-radius:12px;overflow:hidden; }

.quote-row {
  display:grid;

}

.quote-row:last-child { border-bottom:0; }
.quote-row.header { background:#f6fafb;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:800; }

.summary-card {

.summary-line { display:flex;justify-content:space-between;gap:12px;padding:7px 0;color:rgba(255,255,255,.72);font-size:11px; }

.portal-shell {

.portal-hero {
  padding:24px;

.portal-status { display:flex;align-items:flex-start;gap:11px;padding:13px;border-radius:13px;background:var(--teal-50);border:1px solid #caebe8;margin-bottom:14px; }
.portal-money { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
.portal-money .box { padding:12px;border:1px solid var(--line);border-radius:12px; }
.portal-money small { display:block;color:var(--muted);font-size:9px;margin-bottom:4px; }
.portal-money strong { font-size:16px;color:var(--navy-900); }

.qr-placeholder {

}

.qr-cell { background:transparent; }
.qr-cell.on { background:var(--navy-950); }

.calendar {
  display:grid;

  border-radius:14px;

  background:white;
}

.calendar > div { min-height:58px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px; }
.calendar .cal-head { min-height:auto;background:#f6fafb;font-size:10px;font-weight:800;color:var(--muted);position:sticky;top:0;z-index:2; }
.calendar .cal-time { background:#fbfdfd;color:var(--muted);font-size:10px;text-align:right; }
.shift-card { padding:6px;border-radius:8px;background:var(--teal-100);color:var(--teal-700);font-size:9px;line-height:1.35;border-left:3px solid var(--teal-500);cursor:pointer; }

.chart {
  height:220px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:20px 8px 0;
  border-bottom:1px solid var(--line);
}

.chart-col { flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end; }
.chart-bar { width:min(36px,76%);border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,var(--teal-500),var(--teal-600));min-height:4px; }
.chart-bar.secondary { background:linear-gradient(180deg,#8fc7e8,var(--blue-600)); }
.chart-label { color:var(--muted);font-size:9px; }
.chart-value { color:var(--navy-900);font-size:9px;font-weight:800; }

.qa-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.qa-chapter {
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:white;
}

.qa-chapter-top { display:flex;align-items:flex-start;justify-content:space-between;gap:12px; }
.qa-chapter h4 { margin:0 0 3px;font-size:12px;color:var(--navy-900); }
.qa-chapter p { margin:0;color:var(--muted);font-size:10px; }
.qa-stats { display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px; }
.qa-stat { padding:7px;border-radius:8px;background:#f6fafb;text-align:center; }
.qa-stat strong { display:block;font-size:13px; }
.qa-stat small { font-size:8px;color:var(--muted);text-transform:uppercase; }

.empty {
  padding:42px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon {
  width:52px;height:52px;margin:0 auto 12px;border-radius:15px;display:grid;place-items:center;
  background:var(--teal-50);color:var(--teal-700);font-size:22px;
}

.empty h3 { margin:0 0 5px;color:var(--navy-900);font-size:14px; }
.empty p { max-width:420px;margin:0 auto;font-size:11px;line-height:1.5; }

.modal-backdrop {
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(7,25,35,.58);
  backdrop-filter:blur(5px);
  animation:fadeIn .14s ease;
}

.modal {
  width:min(720px,100%);
  max-height:calc(100vh - 40px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:white;
  border-radius:20px;
  box-shadow:var(--shadow-lg);
  animation:modalIn .18s ease;
}

.modal.wide { width:min(1100px,100%); }

.modal.xwide { width:min(1380px,100%); }

.modal-head {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  padding:18px 20px;
  border-bottom:1px solid var(--line);
}

.modal-head h3 { margin:0 0 4px;color:var(--navy-900);font-size:17px; }
.modal-head p { margin:0;color:var(--muted);font-size:11px; }

.modal-close {
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:white;cursor:pointer;font-size:20px;line-height:1;
}

.modal-body { padding:20px;overflow:auto; }

.modal-footer {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  padding:14px 20px;
  border-top:1px solid var(--line);
  background:#fbfdfd;
}

.toast-stack {
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  display:flex;
  flex-direction:column;
  gap:9px;
  width:min(380px,calc(100vw - 36px));
}

.toast {
  display:flex;
  gap:11px;
  align-items:flex-start;
  padding:13px 14px;
  border-radius:13px;
  background:var(--navy-950);
  color:white;
  box-shadow:var(--shadow-lg);
  animation:toastIn .2s ease;
}

.toast-icon { width:28px;height:28px;border-radius:9px;background:rgba(32,182,170,.2);color:#87e9e0;display:grid;place-items:center;flex:0 0 auto; }
.toast strong { display:block;font-size:11px;margin-bottom:2px; }
.toast p { margin:0;color:rgba(255,255,255,.67);font-size:10px;line-height:1.45; }

.login-page {
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(430px,.85fr);
  background:white;
}

.login-visual {
  padding:56px;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:
    radial-gradient(circle at 18% 15%, rgba(32,182,170,.34), transparent 33%),
    radial-gradient(circle at 90% 85%, rgba(79,165,216,.18), transparent 28%),
    linear-gradient(145deg,var(--navy-950),var(--navy-800));
}

.login-visual h1 { margin:28px 0 14px;font-size:clamp(36px,5vw,68px);line-height:.98;letter-spacing:-.055em;max-width:720px; }
.login-visual p { max-width:620px;color:rgba(255,255,255,.68);font-size:15px;line-height:1.65; }
.login-feature-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px; }
.login-feature { padding:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);border-radius:13px; }
.login-feature strong { display:block;font-size:11px; }
.login-feature small { display:block;color:rgba(255,255,255,.55);margin-top:4px;line-height:1.4; }

.login-panel { padding:42px;display:grid;place-items:center;background:#f9fbfc; }
.login-card { width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow); }
.login-card h2 { margin:18px 0 6px;color:var(--navy-900);font-size:26px;letter-spacing:-.035em; }
.login-card > p { color:var(--muted);margin:0 0 22px;line-height:1.55; }

.role-selector { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 18px; }
.role-option { border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:white;text-align:left; }
.role-option.active { border-color:var(--teal-500);background:var(--teal-50);box-shadow:0 0 0 2px rgba(32,182,170,.08); }
.role-option strong { display:block;font-size:10px; }
.role-option small { display:block;font-size:8px;color:var(--muted);margin-top:2px; }

.command-palette {
  position:fixed;inset:0;z-index:120;background:rgba(7,25,35,.5);display:grid;place-items:start center;padding-top:12vh;
}

.command-box { width:min(650px,calc(100vw - 32px));background:white;border-radius:17px;box-shadow:var(--shadow-lg);overflow:hidden; }
.command-input { width:100%;height:56px;border:0;border-bottom:1px solid var(--line);padding:0 18px;outline:none;font-size:14px; }
.command-results { max-height:420px;overflow:auto;padding:8px; }
.command-item { display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer; }
.command-item:hover,.command-item.active { background:var(--teal-50); }
.command-item strong { display:block;font-size:11px; }
.command-item small { display:block;color:var(--muted);font-size:9px; }

@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes modalIn { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
@keyframes toastIn { from { opacity:0; transform:translateX(12px); } to { opacity:1; transform:none; } }

@media (max-width: 1240px) {
  :root { --sidebar-w: 246px; }
  .metric-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grid-4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .quote-layout { grid-template-columns:1fr; }
  .summary-card { position:static; }
  .detail-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .form-grid.cols-4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
}

@media (max-width: 900px) {
  .app-shell { display:block; }
  .sidebar {
    transform:translateX(-102%);
    transition:.22s ease;
  }
  body.sidebar-open .sidebar { transform:translateX(0); }
  .main { min-height:100vh; }
  .mobile-menu { display:grid;place-items:center; }
  .topbar { padding:0 16px; }
  .page { padding:22px 16px 50px; }
  .page-header { flex-direction:column; }
  .page-actions { width:100%;justify-content:flex-start; }
  .grid-2,.grid-3,.qa-grid { grid-template-columns:1fr; }
  .login-page { grid-template-columns:1fr; }
  .login-visual { display:none; }
  .login-panel { min-height:100vh;padding:20px; }
  .environment-pill { display:none; }
}

@media (max-width: 620px) {
  .metric-grid { grid-template-columns:1fr; }
  .form-grid,.form-grid.cols-3,.form-grid.cols-4 { grid-template-columns:1fr; }
  .form-group.span-2,.form-group.span-3 { grid-column:auto; }
  .detail-grid { grid-template-columns:1fr; }
  .portal-money { grid-template-columns:1fr; }
  .modal-backdrop { padding:0;align-items:end; }
  .modal,.modal.wide,.modal.xwide { width:100%;max-height:94vh;border-radius:18px 18px 0 0; }
  .search-hint { display:none; }
  .topbar-actions .icon-btn:nth-child(1) { display:none; }
  .role-selector { grid-template-columns:1fr; }
}

.cell-wrap { max-width:300px; white-space:normal; }

.strong-link:hover { text-decoration:underline; }
.row-action {
  color:var(--teal-700); font-weight:750; border:0; background:transparent;
  cursor:pointer; padding:4px; font-size:10px; white-space:nowrap;
}
.row-actions { display:flex; align-items:center; gap:5px; }
.row-actions button,.row-actions a {
  width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:white;
  display:grid;place-items:center;cursor:pointer;
}
.person-cell { display:flex; align-items:center; gap:9px; min-width:190px; }
.person-cell .avatar { width:34px;height:34px;font-size:10px; }

.filter-bar {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 14px; margin-bottom:14px; border:1px solid var(--line);
  border-radius:13px; background:white; box-shadow:var(--shadow-sm);
}
.search-field {
  flex:1; min-width:260px; position:relative; display:flex; align-items:center;
}
.search-field > .icon { position:absolute; left:12px; color:var(--muted); }
.search-field input {
  width:100%;height:38px;padding:0 12px 0 37px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-soft);outline:0;
}
.search-field input:focus { border-color:var(--teal-500);background:white;box-shadow:0 0 0 3px rgba(32,182,170,.1); }
.filter-bar select { height:38px;border:1px solid var(--line);border-radius:10px;background:white;padding:0 10px; }
.filter-summary { margin-left:auto;color:var(--muted);font-size:10px;font-weight:700; }

.badge {
  display:inline-flex;align-items:center;gap:5px;min-height:21px;padding:3px 7px;
  border-radius:999px;font-size:8px;font-weight:850;letter-spacing:.015em;white-space:nowrap;
}
.badge::before { content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75; }
.badge-success { color:var(--green-600);background:var(--green-100); }
.badge-warning { color:var(--amber-700);background:var(--amber-100); }
.badge-danger { color:var(--coral-700);background:var(--coral-100); }
.badge-info { color:var(--blue-600);background:var(--blue-100); }
.badge-neutral { color:#536a76;background:#edf2f4; }

.empty-state { text-align:center;padding:35px 16px;color:var(--muted); }
.empty-state > .icon { width:44px;height:44px;border-radius:14px;background:var(--teal-50);color:var(--teal-600);margin:0 auto 10px;font-size:20px; }
.empty-state h3 { margin:0 0 5px;color:var(--navy-900);font-size:14px; }
.empty-state p { margin:0 auto 13px;max-width:420px;font-size:11px; }

.status-bars { display:flex; flex-direction:column; gap:10px; }
.status-bar-row { display:grid;grid-template-columns:145px 1fr 25px;align-items:center;gap:10px;font-size:10px; }
.status-bar-row > span { color:var(--muted); }
.status-bar-row strong { text-align:right; }
.bar-track,.progress { height:7px;border-radius:999px;background:#edf2f4;overflow:hidden; }
.bar-track span,.progress span { display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal-600),var(--teal-500)); }
.progress-lg { height:10px; margin:14px 0 18px; }

.timeline-list,.compact-list { display:flex;flex-direction:column; }
.timeline-item { display:grid;grid-template-columns:12px 1fr auto;gap:9px;padding:10px 0;border-bottom:1px solid #edf2f4;align-items:start; }
.timeline-item:last-child { border-bottom:0; }
.timeline-dot { width:8px;height:8px;border-radius:50%;background:var(--teal-500);margin-top:5px;box-shadow:0 0 0 4px var(--teal-100); }
.timeline-item strong,.timeline-item p,.timeline-item small { display:block; }
.timeline-item p { margin:2px 0;color:var(--muted);font-size:9px; }
.timeline-item small { color:var(--muted-2);font-size:8px; }
.compact-item { display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf2f4; }
.compact-item:last-child { border:0; }
.compact-item strong,.compact-item small { display:block; }
.compact-item small { color:var(--muted);font-size:9px;margin-top:2px; }
.align-right { text-align:right; }
.success-callout,.info-callout,.warning-callout {
  padding:12px 13px;border-radius:11px;font-size:10px;line-height:1.55;
}
.success-callout { background:var(--green-100);color:var(--green-600); }
.info-callout { background:var(--blue-100);color:#2f6e99; }
.warning-callout { background:var(--amber-100);color:var(--amber-700);margin-top:15px; }

.profile-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:18px; }
.profile-hero { display:flex;align-items:center;gap:14px;margin-bottom:17px; }
.avatar-lg { width:54px;height:54px;font-size:15px; }
.profile-hero h3 { margin:0 0 4px;font-size:18px;color:var(--navy-900); }
.profile-hero p { margin:0 0 8px;color:var(--muted);font-size:11px; }
.detail-list { margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px; }
.detail-list div { min-width:0; }
.detail-list .full { grid-column:1/-1; }
.detail-list dt { color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:800; }
.detail-list dd { margin:4px 0 0;font-size:11px;font-weight:650;overflow-wrap:anywhere; }
.detail-list dd small { display:block;color:var(--muted);font-weight:400;margin-top:3px; }
.chip-row { display:flex;flex-wrap:wrap;gap:7px;margin-top:15px; }
.chip,.time-chip {
  display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;
  padding:4px 8px;font-size:8px;color:var(--muted);background:white;
}
.chip.on { color:var(--teal-700);background:var(--teal-50);border-color:#c7ebe7; }
.time-chip { margin:2px; }
.financial-summary { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px; }
.financial-summary > div { padding:12px;border-radius:11px;background:var(--surface-soft); }
.financial-summary span,.financial-summary strong { display:block; }
.financial-summary span { color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.045em; }
.financial-summary strong { margin-top:5px;font-size:15px;color:var(--navy-900); }
.portal-link {
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:10px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
  color:var(--teal-700);background:white;font-weight:750;font-size:10px;cursor:pointer;
}

.tabs { display:flex;gap:4px;overflow-x:auto;padding:4px;margin:-4px 0 17px;background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm); }
.tab { min-height:37px;padding:0 13px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:var(--muted);font-size:10px;font-weight:750;white-space:nowrap; }
.tab:hover { background:var(--surface-soft);color:var(--ink); }
.tab.active { background:var(--teal-50);color:var(--teal-700);box-shadow:inset 0 0 0 1px #c5ebe7; }
.tab span { display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:5px;border-radius:999px;background:rgba(32,182,170,.12);font-size:8px; }
.tab-panel { min-width:0; }
.case-summary { display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,.75fr);gap:18px;margin-bottom:18px; }
.case-summary > section,.next-action-panel { background:white;border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow-sm); }
.next-action-panel { background:linear-gradient(145deg,var(--navy-900),var(--navy-800));color:white; }
.next-action-panel > span { width:43px;height:43px;border-radius:13px;background:rgba(32,182,170,.16);color:#69ded4;display:grid;place-items:center;font-size:20px; }
.next-action-panel h3 { margin:14px 0 5px; }
.next-action-panel p { margin:0 0 15px;color:rgba(255,255,255,.72);font-size:11px;line-height:1.55; }
.next-action-panel .btn { background:white;color:var(--navy-900); }
.quote-mini > div:first-child { display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px; }
.quote-mini span,.quote-mini strong,.quote-mini small { display:block; }
.quote-mini small { margin-top:8px;color:var(--muted);font-size:9px; }
.action-strip { display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px; }

.vitals-card { padding:11px 0;border-bottom:1px solid #edf2f4; }
.vitals-card:last-child { border:0; }
.vitals-card strong,.vitals-card small { display:block; }
.vitals-card small { color:var(--muted);font-size:8px;margin-top:3px; }
.vitals-card > div { display:flex;gap:6px;flex-wrap:wrap;margin:8px 0; }
.vitals-card > div span { padding:4px 6px;border-radius:7px;background:var(--teal-50);color:var(--teal-700);font-size:8px;font-weight:700; }
.note-card { padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:white; }
.note-card header,.note-card footer { display:flex;align-items:center;justify-content:space-between;gap:10px; }
.note-card header strong,.note-card header small { display:block; }
.note-card header small { color:var(--muted);font-size:8px;margin-top:3px; }
.note-card h3 { margin:12px 0 5px;font-size:13px; }
.note-card p { color:#405966;font-size:10px;line-height:1.65; }
.note-card footer { margin-top:10px;padding-top:9px;border-top:1px solid #edf2f4; }

.quote-overview { display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start; }
.quote-main { min-width:0; }
.quote-status-header { display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm); }
.quote-status-header h2 { margin:7px 0 2px;font-size:19px; }
.quote-status-header p { margin:0;color:var(--muted);font-size:9px; }
.progress-circle { --progress:50; width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal-500) calc(var(--progress)*1%),#edf2f4 0);position:relative; }
.progress-circle::after { content:"";position:absolute;inset:7px;border-radius:50%;background:white; }
.progress-circle span { position:relative;z-index:1;font-weight:850;font-size:12px; }
.quote-category { margin-bottom:13px;background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow-sm); }
.quote-category > header { display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line); }
.quote-category h3 { margin:0;font-size:13px; }
.quote-category header span { color:var(--muted);font-size:9px; }
.quote-summary-panel { position:sticky;top:88px;background:white;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow); }
.summary-line { display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf2f4;font-size:10px; }
.summary-line.total { font-size:13px;font-weight:850;color:var(--navy-900); }
.summary-line.balance { margin:8px -7px 0;padding:12px 7px;border:0;border-radius:10px;background:var(--amber-100);color:var(--amber-700);font-size:13px;font-weight:850; }
.coverage-block { display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0; }
.coverage-block > div { padding:10px;border-radius:10px;background:var(--surface-soft); }
.coverage-block span,.coverage-block strong { display:block; }
.coverage-block span { color:var(--muted);font-size:8px; }
.coverage-block strong { margin-top:4px;font-size:13px; }
.summary-actions { display:flex;flex-direction:column;gap:7px;margin:16px 0; }
.summary-actions .btn { width:100%; }
.patient-mini { display:flex;align-items:center;gap:9px;padding-top:12px;border-top:1px solid var(--line); }
.patient-mini strong,.patient-mini small { display:block; }
.patient-mini small { color:var(--muted);font-size:8px;margin-top:2px;overflow-wrap:anywhere; }
.quote-comments { padding:10px;border-radius:9px;background:var(--surface-soft);font-size:9px;color:var(--muted);line-height:1.5; }

.vertical-timeline,.portal-timeline { position:relative; }
.vertical-timeline article { display:grid;grid-template-columns:15px 1fr;gap:8px;padding-bottom:14px; }
.vertical-timeline article > span { width:8px;height:8px;border-radius:50%;background:var(--teal-500);margin-top:4px;box-shadow:0 0 0 4px var(--teal-100); }
.vertical-timeline strong,.vertical-timeline small { display:block; }
.vertical-timeline small { color:var(--muted);font-size:8px;margin-top:2px; }
.vertical-timeline p { margin:4px 0 0;color:#526a76;font-size:9px; }

.kanban-board { display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px; }
.kanban-column { min-height:450px;background:#eaf1f4;border:1px solid #d7e3e8;border-radius:14px;padding:10px; }
.kanban-column > header { display:flex;align-items:center;justify-content:space-between;padding:4px 3px 10px; }
.kanban-column > header h2 { margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.045em; }
.kanban-column > header span { min-width:22px;height:22px;border-radius:999px;background:white;display:grid;place-items:center;font-size:9px;font-weight:800; }
.kanban-card { padding:12px;border-radius:11px;background:white;border:1px solid #d9e5e9;box-shadow:0 3px 9px rgba(15,45,63,.05);margin-bottom:9px; }
.kanban-card header { display:flex;align-items:center;justify-content:space-between;gap:6px; }
.kanban-card header a { font-weight:850;color:var(--teal-700);font-size:10px; }
.kanban-card h3 { margin:10px 0 2px;font-size:12px; }
.kanban-card p,.kanban-card small { color:var(--muted);font-size:8px;line-height:1.45; }
.kanban-money { display:flex;justify-content:space-between;gap:6px;margin:9px 0;padding:7px;border-radius:8px;background:var(--surface-soft);font-size:8px; }
.kanban-card > button { width:100%;margin-top:9px;height:30px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--teal-700);font-size:9px;font-weight:750;cursor:pointer; }
.kanban-empty { color:var(--muted);text-align:center;padding:30px 5px;font-size:9px; }

.module-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px; }
.module-card { min-height:150px;display:grid;grid-template-columns:46px 1fr 20px;gap:13px;align-items:start;padding:17px;background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:.16s; }
.module-card:hover { transform:translateY(-2px);box-shadow:var(--shadow);border-color:#bfe4e1; }
.module-card > span:first-child { width:44px;height:44px;border-radius:13px;background:var(--teal-100);color:var(--teal-700);display:grid;place-items:center;font-size:20px; }
.module-card h2 { margin:2px 0 6px;font-size:14px; }
.module-card p { margin:0 0 12px;color:var(--muted);font-size:9px;line-height:1.55; }
.module-card strong { font-size:9px;color:var(--teal-700); }

.medication-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px; }
.medication-card { min-width:0; }
.medication-card .table-wrap table { min-width:650px; }
.medication-card .card-footer { flex-wrap:wrap; justify-content:flex-start; }
.choice-stack { display:grid; gap:12px; }
.choice-stack .btn { min-height:52px; justify-content:flex-start; text-align:left; }
.order-section-picker { display:grid; grid-template-columns:minmax(190px,.35fr) minmax(0,1fr); gap:10px 14px; align-items:start; }
.order-section-picker > label { min-height:42px; display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface-soft); }
.order-section-picker > textarea { min-width:0; resize:vertical; }

.agenda-layout { display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start; }
.calendar-sidebar { padding:15px; }
.mini-calendar header { display:flex;align-items:center;justify-content:space-between;margin-bottom:12px; }
.mini-calendar header button { border:0;background:transparent;cursor:pointer;font-size:18px; }
.weekday-row,.day-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:4px; }
.weekday-row span { text-align:center;color:var(--muted);font-size:8px;font-weight:800;padding:4px; }
.day-grid span { min-height:31px;display:grid;place-items:center;border-radius:8px;font-size:9px; }
.day-grid span.today { background:var(--teal-500);color:white;font-weight:850; }
.resource-legend { margin-top:18px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px; }
.resource-legend label { display:flex;align-items:center;gap:7px;font-size:9px; }
.legend-dot { width:8px;height:8px;border-radius:50%;background:var(--teal-500); }
.shift-list { display:flex;flex-direction:column;gap:9px; }
.shift-card { display:grid;grid-template-columns:100px 1fr auto;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px;background:white; }
.shift-card time { padding:8px;border-radius:9px;background:var(--teal-50);text-align:center;color:var(--teal-700); }
.shift-card time strong,.shift-card time small { display:block; }
.shift-card time small { font-size:8px;margin-top:2px; }
.shift-card h3 { margin:0 0 3px;font-size:12px; }
.shift-card p,.shift-card > div small { margin:0;color:var(--muted);font-size:9px; }

.warehouse-grid,.doctor-grid,.kit-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px; }
.warehouse-card,.doctor-card { background:white;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm); }
.warehouse-card > header,.doctor-card > header { display:flex;align-items:center;gap:11px;margin-bottom:17px; }
.warehouse-card > header > .icon { width:42px;height:42px;border-radius:12px;background:var(--teal-100);color:var(--teal-700);font-size:18px; }
.warehouse-card header h2,.doctor-card header h2 { margin:0 0 3px;font-size:14px; }
.warehouse-card header p,.doctor-card header p { margin:0;color:var(--muted);font-size:9px; }
.warehouse-card header .badge,.doctor-card header .badge { margin-left:auto; }
.kit-card ul { list-style:none;margin:0;padding:0; }
.kit-card li { display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf2f4;font-size:10px; }
.kit-card li:last-child { border:0; }

.catalog-shortcuts { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:17px; }
.catalog-shortcuts a { display:grid;grid-template-columns:38px 1fr;gap:3px 10px;align-items:center;padding:13px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm); }
.catalog-shortcuts a > span { grid-row:1/3;width:37px;height:37px;border-radius:10px;background:var(--teal-50);color:var(--teal-700);display:grid;place-items:center; }
.catalog-shortcuts strong { font-size:11px; }
.catalog-shortcuts small { color:var(--muted);font-size:8px; }

.bar-chart { height:230px;display:flex;align-items:flex-end;gap:14px;padding:18px 10px 0; }
.bar-chart > div { flex:1;height:100%;display:grid;grid-template-rows:1fr auto auto;align-items:end;text-align:center;gap:4px; }
.bar-chart > div > span { width:58%;min-height:4px;margin:0 auto;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,var(--teal-500),var(--teal-700));box-shadow:0 6px 14px rgba(32,182,170,.18); }
.bar-chart small { color:var(--muted);font-size:8px; }
.bar-chart strong { font-size:9px; }
.donut-wrap { display:flex;align-items:center;gap:17px; }
.donut-chart { width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--teal-500) 0 29%,var(--blue-600) 29% 45%,var(--amber-500) 45% 62%,var(--purple-600) 62% 78%,var(--coral-500) 78% 100%);position:relative;flex:0 0 auto; }
.donut-chart::after { content:"";position:absolute;inset:28px;border-radius:50%;background:white; }
.chart-legend { display:flex;flex-direction:column;gap:7px;min-width:0; }
.chart-legend > div { display:grid;grid-template-columns:8px 1fr auto;gap:7px;align-items:center;font-size:8px; }
.chart-legend > div > span { width:7px;height:7px;border-radius:50%;background:var(--teal-500); }
.chart-legend label { color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

.settings-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start; }
.form-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 15px; }
.form-grid.compact-form { gap:9px 11px; }
.form-grid label { display:flex;flex-direction:column;gap:6px;color:#435a66;font-size:9px;font-weight:750; }
.form-grid label > input:not([type=checkbox]):not([type=file]),.form-grid label > select,.form-grid label > textarea {
  width:100%;border:1px solid var(--line);border-radius:9px;background:white;outline:0;color:var(--ink);
}
.form-grid label > input:not([type=checkbox]):not([type=file]),.form-grid label > select { height:40px;padding:0 10px; }
.form-grid label > textarea { padding:10px;resize:vertical;line-height:1.5; }

const memoryStorage = new Map();

const safeStorage = {
  getItem(key) {
    try {
      if (typeof window !== "undefined" && window.localStorage) return window.localStorage.getItem(key);
    } catch {
      // Orígenes opacos, modo archivo o políticas del navegador.
    }
    return memoryStorage.has(String(key)) ? memoryStorage.get(String(key)) : null;
  },
  setItem(key, value) {
    try {
      if (typeof window !== "undefined" && window.localStorage) {
        window.localStorage.setItem(key, String(value));
        return;
      }
    } catch {
      // Usa memoria durante QA.
    }
    memoryStorage.set(String(key), String(value));
  },
  removeItem(key) {
    try {
      if (typeof window !== "undefined" && window.localStorage) {
        window.localStorage.removeItem(key);
        return;
      }
    } catch {}
    memoryStorage.delete(String(key));
  },
  clear() {
    try {
      if (typeof window !== "undefined" && window.localStorage) {
        window.localStorage.clear();
        return;
      }
    } catch {}
    memoryStorage.clear();
  }
};

const ITEM_CATEGORIES = [
  "SERVICES",
  "STUDIES",
  "MEDICATIONS",
  "SUPPLIES",
  "EQUIPMENT",
  "FEES",
  "EXTRAS"
];

const ITEM_CATEGORY_LABELS = {
  SERVICES: "Servicios",
  STUDIES: "Estudios diagnósticos",
  MEDICATIONS: "Medicamentos",
  SUPPLIES: "Insumos",
  EQUIPMENT: "Equipos",

function uid(prefix = "ID") {
  const cryptoObj = globalThis.crypto;
  if (cryptoObj?.randomUUID) return `${prefix}-${cryptoObj.randomUUID().slice(0, 8).toUpperCase()}`;
  return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
}

function money(value, currency = "USD", locale = "es-SV") {
  const amount = Number(value || 0);
  return new Intl.NumberFormat(locale, {
    style: "currency",
    currency,
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(amount);
}

function formatDate(value, withTime = false, locale = "es-SV") {
  if (!value) return "—";
  const raw = String(value);
  // A date-only value represents a calendar day, not midnight UTC. Anchoring
  // it at noon prevents western time zones from rendering the prior day.
  const date = new Date(/^\d{4}-\d{2}-\d{2}$/.test(raw) ? `${raw}T12:00:00Z` : value);
  if (Number.isNaN(date.getTime())) return String(value);
  const options = withTime
    ? { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" }
    : { year: "numeric", month: "short", day: "2-digit" };
  return new Intl.DateTimeFormat(locale, options).format(date);
}

function roundMoney(value) {
  return Math.round((Number(value || 0) + Number.EPSILON) * 100) / 100;
}

function calculateQuote(items = [], discount = { type: "PERCENT", value: 0 }, insuranceApproved = 0) {
  const categoryTotals = Object.fromEntries(ITEM_CATEGORIES.map((category) => [category, 0]));
  let subtotal = 0;

  for (const item of items) {
    const quantity = Math.max(0, Number(item.quantity || 0));
    const unitPrice = Math.max(0, Number(item.unitPrice || 0));
    const itemDiscount = Math.max(0, Number(item.discountAmount || 0));
    const lineTotal = Math.max(0, quantity * unitPrice - itemDiscount);
    subtotal += lineTotal;
    const category = ITEM_CATEGORIES.includes(item.category) ? item.category : "EXTRAS";
    categoryTotals[category] += lineTotal;
  }

  let discountAmount = 0;
  if (discount?.type === "CATEGORY_PERCENTAGES") {
    discountAmount = Object.entries(categoryTotals).reduce((sum, [category, categoryTotal]) => {
      const percentage = Math.min(100, Math.max(0, Number(discount.categories?.[category] || 0)));
      return sum + categoryTotal * percentage / 100;
    }, 0);
  } else if (discount?.type === "FIXED") discountAmount = Math.max(0, Number(discount.value || discount.fixedAmount || 0));
  else discountAmount = subtotal * Math.max(0, Number(discount?.value || 0)) / 100;

  const configuredMaximum = discount?.maxAmount === null || discount?.maxAmount === undefined || discount?.maxAmount === ""
    ? null
    : Number(discount.maxAmount);
  if (Number.isFinite(configuredMaximum) && configuredMaximum >= 0) {
    discountAmount = Math.min(discountAmount, configuredMaximum);
  }
  discountAmount = Math.min(discountAmount, subtotal);
  const total = roundMoney(subtotal - discountAmount);
  const insurerAmount = roundMoney(Math.min(Math.max(0, Number(insuranceApproved || 0)), total));
  const patientAmount = roundMoney(Math.max(0, total - insurerAmount));

  return {
    subtotal: roundMoney(subtotal),
    discountAmount: roundMoney(discountAmount),
    total,
    insurerAmount,
    patientAmount,
    categoryTotals: Object.fromEntries(
      Object.entries(categoryTotals).map(([key, value]) => [key, roundMoney(value)])
    )
  };
}

function validatePayment({ amount, balance, existingReferences = [], reference = "" }) {
  const numericAmount = roundMoney(amount);
  const numericBalance = roundMoney(balance);
  const normalizedReference = String(reference || "").trim().toUpperCase();

  if (!(numericAmount > 0)) return { ok: false, code: "INVALID_AMOUNT", message: "El monto debe ser mayor que cero." };
  if (numericAmount > numericBalance + 0.01) {
    return { ok: false, code: "OVERPAYMENT", message: "El pago supera el saldo pendiente." };
  }
  if (normalizedReference && existingReferences.map((x) => String(x).trim().toUpperCase()).includes(normalizedReference)) {
    return { ok: false, code: "DUPLICATE_REFERENCE", message: "La referencia ya fue registrada." };
  }
  return { ok: true, amount: numericAmount, reference: normalizedReference };
}

function nextQuoteStatus(status) {
  if (status === "REJECTED" || status === "CANCELLED" || status === "CLOSED") return status;
  const index = QUOTE_STATUS_FLOW.indexOf(status);
  if (index < 0) return "DRAFT";
  return QUOTE_STATUS_FLOW[Math.min(index + 1, QUOTE_STATUS_FLOW.length - 1)];
}

function canTransitionQuote(from, to) {
  if (from === to) return true;
  if (["CLOSED", "CANCELLED"].includes(from)) return false;
  if (to === "REJECTED" || to === "CANCELLED") return true;
  const current = QUOTE_STATUS_FLOW.indexOf(from);
  const target = QUOTE_STATUS_FLOW.indexOf(to);
  if (current < 0 || target < 0) return false;

  const allowedBranches = {
    INSURER_REVIEW: ["INFO_REQUIRED", "PARTIALLY_APPROVED", "APPROVED"],
    INFO_REQUIRED: ["INSURER_REVIEW", "PARTIALLY_APPROVED", "APPROVED"],
    PARTIALLY_APPROVED: ["APPROVED", "PATIENT_PAYMENT"],
    APPROVED: ["PATIENT_PAYMENT", "SERVICE_SCHEDULED"]
  };
  return target === current + 1 || (allowedBranches[from] || []).includes(to);
}

function quoteProgress(status) {
  if (status === "REJECTED" || status === "CANCELLED") return 100;
  const index = QUOTE_STATUS_FLOW.indexOf(status);
  if (index < 0) return 0;
  return Math.round((index / (QUOTE_STATUS_FLOW.length - 1)) * 100);
}

function quoteBalance(quote, payments = []) {
  const applied = payments
    .filter((payment) => payment.quoteId === quote.id && payment.status === "APPLIED")
    .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
  return roundMoney(Math.max(0, Number(quote.patientAmount || 0) - applied));
}

function inventoryFree(item) {
  return Number(item.stock || 0) - Number(item.committed || 0);
}

function inventoryState(item) {
  const free = inventoryFree(item);
  if (free <= 0) return "OUT";
  if (free <= Number(item.minimum || 0)) return "LOW";
  return "OK";
}

function statementBalance(statement) {
  return roundMoney(
    Number(statement.gross || 0)
    + Number(statement.adjustments || 0)
    - Number(statement.withholdings || 0)
    - Number(statement.paid || 0)
  );
}

function maskDocument(value) {
  const text = String(value || "");
  if (text.length <= 4) return "••••";
  return `${"•".repeat(Math.max(4, text.length - 4))}${text.slice(-4)}`;
}

function maskPhone(value) {
  const digits = String(value || "").replace(/\D/g, "");
  if (digits.length < 4) return "••••";
  return `•••• ${digits.slice(-4)}`;
}

function normalizeSearch(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/\p{Diacritic}/gu, "")
    .toLowerCase()
    .trim();
}

function includesSearch(record, query, fields = []) {
  const normalized = normalizeSearch(query);
  if (!normalized) return true;
  return fields.some((field) => normalizeSearch(record?.[field]).includes(normalized));
}

function csvEscape(value) {
  const text = String(value ?? "");
  if (/[",\n]/.test(text)) return `"${text.replaceAll('"', '""')}"`;
  return text;
}

function toCsv(rows = [], columns = []) {
  const resolvedColumns = columns.length
    ? columns
    : Object.keys(rows[0] || {}).map((key) => ({ label: key, value: key }));
  const header = resolvedColumns.map((column) => csvEscape(column.label)).join(",");
  const body = rows.map((row) => resolvedColumns.map((column) => csvEscape(
    typeof column.value === "function" ? column.value(row) : row[column.value]
  )).join(",")).join("\n");
  return `${header}\n${body}`;
}

function ageFromBirthDate(value, now = new Date()) {
  if (!value) return null;
  const birth = new Date(value);
  if (Number.isNaN(birth.getTime())) return null;
  let age = now.getFullYear() - birth.getFullYear();
  const beforeBirthday = now.getMonth() < birth.getMonth()
    || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate());
  if (beforeBirthday) age -= 1;
  return Math.max(0, age);
}

function daysBetween(start, end = new Date()) {
  const a = new Date(start);
  const b = new Date(end);
  if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return null;
  return Math.max(0, Math.floor((b.getTime() - a.getTime()) / 86400000));
}

function safeText(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function roleCan(role, permission) {
  const permissions = {
    SUPERADMIN: ["*"],
    ADMIN: ["*"],
    NURSE: [
      "dashboard:read", "patients:read", "cases:read",
      "quotes:read", "insurance:read", "clinical:read", "clinical:write",
      "clinical:sign",
      "agenda:read", "inventory:read"
    ],
    DOCTOR: [
      "dashboard:read", "patients:read", "cases:read", "quotes:read",
      "insurance:read", "clinical:read", "clinical:write", "clinical:sign",
      "agenda:read", "doctors:read", "statements:read"
    ],
    INVENTORY: [
      "dashboard:read", "patients:read", "cases:read", "purchases:read",
      "purchases:write", "inventory:read", "inventory:write",
      "catalogs:read", "catalogs:write", "reports:read", "qa:read"
    ],
    FINANCE: [
      "dashboard:read", "patients:read", "cases:read", "quotes:read",
      "quotes:write", "insurance:read", "insurance:write", "payments:read",
      "payments:write", "purchases:read", "inventory:read", "doctors:read",
      "statements:read", "statements:write", "reports:read", "audit:read", "qa:read"
    ],
    AUDITOR: [
      "dashboard:read", "patients:read", "cases:read", "quotes:read",
      "insurance:read", "payments:read", "clinical:read", "agenda:read",
      "purchases:read", "inventory:read", "catalogs:read", "doctors:read",
      "statements:read", "reports:read", "audit:read", "qa:read", "settings:read"
    ]
  };
  const grants = permissions[role] || [];
  if (grants.includes("*") || grants.includes(permission)) return true;
  const [scope, action] = permission.split(":");
  if (action === "read" && grants.includes(`${scope}:write`)) return true;
  return false;
}

function hashString(value) {
  let hash = 2166136261;
  for (const char of String(value || "")) {
    hash ^= char.charCodeAt(0);
    hash = Math.imul(hash, 16777619);
  }
  return (hash >>> 0).toString(16).padStart(8, "0");
}

async function loadRuntimeConfig() {
  const localOverride = (() => {
    try {
      return JSON.parse(safeStorage.getItem("aec-runtime-config") || "{}");
    } catch {
      return {};
    }
  })();

  let remote = {};
  if (location.protocol === "http:" || location.protocol === "https:") {
    try {
      const response = await fetch("/api/runtime-config", {
        headers: { Accept: "application/json" },
        cache: "no-store"
      });
      if (response.ok) remote = await response.json();
    } catch {
      // El modo local puede ejecutarse sin API.
    }
  }

  return {
    ...DEFAULT_CONFIG,
    ...remote,
    ...localOverride
  };
}

function saveRuntimeConfigOverride(values) {
  safeStorage.setItem("aec-runtime-config", JSON.stringify(values));
}

const saveRuntimeOverride = saveRuntimeConfigOverride;
