# BUILD_AND_PUSH only, after project and budget approval. No deployment step.
# Core/PostgreSQL 18. Corporate schema adoption and staging must be approved separately.
steps:
  - id: validate
    name: node:24-bookworm-slim
    entrypoint: node
    args: ['scripts/deployment/validate-build.mjs']
    env:
      - 'GCP_PROJECT_ID=$PROJECT_ID'
      - 'GCP_REGION=${_REGION}'
      - 'ARTIFACT_REGISTRY_REPOSITORY=${_REPOSITORY}'
      - 'IMAGE_NAME=${_IMAGE}'
      - 'SOURCE_SHA=${_SOURCE_SHA}'
      - 'TRIGGER_SHA=$COMMIT_SHA'
  - id: test
    name: node:24-bookworm-slim
    entrypoint: bash
    args: ['-euc', 'npm install --global npm@11.18.0 && npm ci && npm ls uuid && npm audit --omit=dev && npm test && npm run test:react && npm run typecheck && npm run lint']
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - 'docker build --platform linux/amd64 --build-arg SOURCE_SHA="${_SOURCE_SHA}" -t "$$(cat /workspace/.local/cloud-run/image-ref.txt)" .'
  - id: test-final-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['scripts/deployment/smoke-image.sh', '/workspace/.local/cloud-run/image-ref.txt']
  - id: build-operator
    name: gcr.io/cloud-builders/docker
    args: ['build', '--platform', 'linux/amd64', '--target', 'operator', '--build-arg', 'SOURCE_SHA=${_SOURCE_SHA}', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}-operator:${_SOURCE_SHA}', '.']
  - id: validate-operator
    name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', '--read-only', '--cap-drop', 'ALL', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}-operator:${_SOURCE_SHA}', '--dry-run']
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-euc', 'docker push "$$(cat /workspace/.local/cloud-run/image-ref.txt)" && docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}-operator:${_SOURCE_SHA}"']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_SOURCE_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}-operator:${_SOURCE_SHA}'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: us-central1
  _REPOSITORY: REQUIRED
  _IMAGE: REQUIRED
  _SOURCE_SHA: REQUIRED
